<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!--
    RouteCase Activity Bar Icon
    3-Node Connected Route Graph matching the official RouteCase topology mark.
    Uses currentColor and calibrated opacities so VS Code themes (dark, light, high-contrast) apply automatically.
  -->
  <!-- Connecting line: Top-left node to Right hub node -->
  <line x1="8" y1="7.5" x2="17" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />

  <!-- Connecting line: Bottom-left node to Right hub node -->
  <line x1="6.5" y1="17" x2="17" y2="12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />

  <!-- Top-left node -->
  <circle cx="8" cy="7.5" r="3.2" fill="currentColor" />

  <!-- Bottom-left node -->
  <circle cx="6.5" cy="17" r="3.2" fill="currentColor" />

  <!-- Right hub node (prominent destination) -->
  <circle cx="17" cy="12" r="4.2" fill="currentColor" />
</svg>
