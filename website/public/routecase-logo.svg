<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Obsidian Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Case Gradient -->
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Route Gradient: Emerald to Mint -->
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Base Squircle with smooth rounded corners -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#10B981" stroke-opacity="0.35" stroke-width="2.5" />

  <!-- Briefcase Handle -->
  <path d="M 191 156 V 132 A 24 24 0 0 1 215 108 H 297 A 24 24 0 0 1 321 132 V 156" 
        fill="none" stroke="#94A3B8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Briefcase Body -->
  <rect x="91" y="150" width="330" height="230" rx="36" fill="url(#caseGrad)" stroke="#10B981" stroke-width="4" stroke-opacity="0.85" />

  <!-- Case Split Line -->
  <line x1="103" y1="222" x2="409" y2="222" stroke="#10B981" stroke-opacity="0.35" stroke-width="3" />

  <!-- Central Latch -->
  <rect x="234" y="209" width="44" height="26" rx="8" fill="#10B981" />

  <!-- Route Line & Checkmark -->
  <!-- Route Segment 1 -->
  <line x1="151" y1="318" x2="236" y2="318" stroke="#10B981" stroke-width="10" stroke-linecap="round" />

  <!-- Route Segment 2 sweeping into Success Checkmark -->
  <polyline points="236,318 296,332 361,262" 
            fill="none" stroke="#34D399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node 1: Origin Endpoint -->
  <circle cx="151" cy="318" r="15" fill="#FFFFFF" stroke="#10B981" stroke-width="4" />

  <!-- Node 2: Route Waypoint -->
  <circle cx="236" cy="318" r="13" fill="#10B981" />
  <circle cx="236" cy="318" r="5" fill="#FFFFFF" />

  <!-- Node 3: Checkmark Tip (Success) -->
  <circle cx="361" cy="262" r="10" fill="#34D399" />
</svg>
